version: "3.8"

services:
  app:
    build: .
    container_name: legal-ai
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=法律AI
      - DEBUG=false
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_API_URL=${AI_API_URL:-https://api.deepseek.com/v1/chat/completions}
      - AI_MODEL=${AI_MODEL:-deepseek-v4-flash}
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./homework.db}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production-please}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:8000}
      - DEFAULT_ADMIN_USERNAME=${DEFAULT_ADMIN_USERNAME:-admin}
      - DEFAULT_ADMIN_PASSWORD=${DEFAULT_ADMIN_PASSWORD:-Admin@12345}
      - DEFAULT_ADMIN_EMAIL=${DEFAULT_ADMIN_EMAIL:-admin@example.com}
      - DEFAULT_ADMIN_NICKNAME=${DEFAULT_ADMIN_NICKNAME:-系统管理员}
      # OCR (disabled by default in container; use PaddleOCR only if GPU available)
      - OCR_PRIMARY_ENGINE=tesseract
      - OCR_FALLBACK_ENGINE=tesseract
      - OCR_LANG=ch
    volumes:
      - app_data:/app/data
      - app_uploads:/app/uploads
    restart: unless-stopped

  # Optional: PostgreSQL (uncomment and set DATABASE_URL to use)
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: legal-ai-db
  #   environment:
  #     POSTGRES_USER: legal_ai
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-legal_ai}
  #     POSTGRES_DB: legal_ai
  #   volumes:
  #     - pg_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   restart: unless-stopped

volumes:
  app_data:
  app_uploads:
  # pg_data:
