[project]
name = "legal-ai-backend"
version = "0.1.0"
description = "智能法律顾问系统 - 后端"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["data", "uploads", "vector_db"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "E501",
    "B008",
    "B904",
    "UP007",
]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"app/core/ai_analyzer.py" = ["E501"]
"tests/**/*.py" = ["B011"]
